[package]
name = "shader_language_server"
description = "Language server for HLSL / GLSL / WGSL shaders using LSP protocol."
version = "1.6.2"
repository = "https://github.com/antaalt/shader-sense/tree/main/bin/shader-language-server"
keywords = ["shader", "lsp", "hlsl", "glsl", "wgsl"]
categories = ["development-tools", "graphics"]
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true


# Need this as we cant rename crates on crates.io
# Remove all refs to '_' char
[[bin]]
name = "shader-language-server"
path = "src/main.rs"

[dependencies]
shader-sense.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
cfg-if = "1.0.0"
env_logger = "0.11.5"
log = "0.4.22"
lsp-server = "=0.7.8" # 0.7.9 has some breaking changes.
lsp-types = "0.95.0"
crossbeam-channel = "0.5.8"
lru = "0.16.0"
base64 = "0.22.1"
