[workspace]

members = [
    "shader-sense",
    "shader-language-server",
    "shader-sense-cli",
    "shader-intrinsic-parser"
]
resolver = "2"

# For profiling. Build with:
# cargo build --profile=release-with-debug
# And attach server with vs or any debugger
[profile.release-with-debug]
inherits = "release"
debug = true


[patch.crates-io]
# DXC crash when empty warning in hassle rs. 
# Fix not yet available on latest 0.12.0. Temp fix that prevent publish on crates.io
# https://github.com/Traverse-Research/hassle-rs/issues/85
hassle-rs = { git="https://github.com/antaalt/hassle-rs.git", branch="fix-crash-empty-blob" }
tree-sitter-wgsl-bevy = { git = "https://github.com/antaalt/tree-sitter-wgsl-bevy", branch = "fix-compil-clang" }


[workspace.package]
version = "1.4.3" # shader-sense version
edition = "2021"
license-file = "./LICENSE"
repository = "https://github.com/antaalt/shader-sense"
authors = ["antaalt"]
rust-version = "1.89" # Minimal version required for wasm C ABI https://github.com/wasm-bindgen/wasm-bindgen/issues/3454

[workspace.dependencies]
shader-sense = { version = "1.4.3", path = "./shader-sense" }