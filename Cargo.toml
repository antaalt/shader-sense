[workspace]

members = [
    "lib/shader-sense",
    "lib/shader-sense-core",
    "lib/shader-sense-symbols",
    "lib/shader-sense-validator",
    "bin/shader-language-server",
    "bin/shader-sense-cli",
    "bin/shader-intrinsic-parser"
]
resolver = "2"

# For profiling. Build with:
# cargo build --profile=release-with-debug
# And attach server with vs or any debugger
[profile.release-with-debug]
inherits = "release"
debug = true


[patch.crates-io]
# DXC crash when empty warning in hassle rs. 
# Fix not yet available on latest 0.12.0. Temp fix that prevent publish on crates.io
# https://github.com/Traverse-Research/hassle-rs/issues/85
hassle-rs = { git="https://github.com/antaalt/hassle-rs.git", branch="fix-crash-empty-blob" }


[workspace.package]
version = "1.6.1" # shader-sense version
edition = "2021"
license-file = "./LICENSE"
repository = "https://github.com/antaalt/shader-sense"
authors = ["antaalt"]
rust-version = "1.89" # Minimal version required for wasm C ABI https://github.com/wasm-bindgen/wasm-bindgen/issues/3454

[workspace.dependencies]
shader-sense = { version = "1.6.1", path = "./lib/shader-sense" }
shader-sense-core = { version = "1.6.1", path = "./lib/shader-sense-core" }
shader-sense-validator = { version = "1.6.1", path = "./lib/shader-sense-validator" }
shader-sense-symbols = { version = "1.6.1", path = "./lib/shader-sense-symbols" }
serde = { version = "1.0.199", features = ["derive"] }
serde_json = "1.0.116"