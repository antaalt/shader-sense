name: Package Server

# Bundle the server artifacts built by build.yml with dxc and upload them to a release.
# Must be called from a workflow run that already ran build.yml, so that artifacts are available.
on:
  workflow_call:
    inputs:
      release-tag:
        description: 'Tag of the release to upload the packages to.'
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest

    strategy:
      matrix:
          include:
            - rust-target: x86_64-pc-windows-msvc
              dxc-zip: dxc_2024_05_24.zip
              dxc-path: bin/x64/
              dxc-dxil: dxil.dll
              dxc-dxcompiler: dxcompiler.dll
            - rust-target: aarch64-pc-windows-msvc
              dxc-zip: dxc_2024_05_24.zip
              dxc-path: bin/arm64/
              dxc-dxil: dxil.dll
              dxc-dxcompiler: dxcompiler.dll
            - rust-target: x86_64-unknown-linux-gnu
              dxc-zip: linux_dxc_2024_05_24.x86_64.tar.gz
              dxc-path: lib/
              dxc-dxil: libdxil.so
              dxc-dxcompiler: libdxcompiler.so
            - rust-target: wasm32-wasip1-threads
              dxc-zip: # Empty means unused.
              dxc-path:
              dxc-dxil:
              dxc-dxcompiler:

    steps:
      - uses: actions/checkout@v7 # Required for release upload
      - name: Create bundle folder
        run: mkdir -p ./package
      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: shader-language-server-${{ matrix.rust-target }}
          path: ./package
      - name: Download dxc dll.
        uses: robinraju/release-downloader@v1.13
        if: ${{ matrix.dxc-zip != '' }}
        with:
          repository: 'microsoft/DirectXShaderCompiler'
          tag: v1.8.2405
          fileName: ${{ matrix.dxc-zip }}
          extract: true
          out-file-path: './dxc'
      - name: Copy dxc library to package.
        if: ${{ matrix.dxc-zip != '' }}
        run: cp ./dxc/${{ matrix.dxc-path }}${{ matrix.dxc-dxcompiler }} ./package/${{ matrix.dxc-dxcompiler }} && cp ./dxc/${{ matrix.dxc-path }}${{ matrix.dxc-dxil }} ./package/${{ matrix.dxc-dxil }}
      - name: Zip package
        run: zip -v -r -j shader-language-server-${{ matrix.rust-target }}.zip ./package
      - name: Upload release package
        # Clobber to overwrite previous assets, as the nightly release is reused for every commit.
        run: gh release upload ${{ inputs.release-tag }} shader-language-server-${{ matrix.rust-target }}.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
