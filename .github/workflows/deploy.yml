name: Deploy Extension

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # build.yml nightly job requires it, even if it is skipped on release.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml

  deploy:
    permissions:
      contents: write
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    runs-on: ubuntu-latest
    needs: deploy # Dont really need but keep to avoid issue on issues.
    # Skip pre-release because cargo dont support pre-release tag, and nightly which is not a version.
    if: ${{ !github.event.release.prerelease && github.event.release.tag_name != 'nightly' }}

    steps:
      - uses: actions/checkout@v7 # Required for release upload
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # Publish workspace (sense+server), intrinsics parser is marked as private
      - uses: katyo/publish-crates@v2
        with:
          ignore-unpublished-changes: true
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}