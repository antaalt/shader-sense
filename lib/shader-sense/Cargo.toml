[package]
name = "shader-sense"
description = "Library for runtime shader validation and symbol inspection"
readme = "../README.md"
repository = "https://github.com/antaalt/shader-sense"
keywords = ["shader", "validate", "hlsl", "glsl", "wgsl"]
categories = ["development-tools", "graphics"]
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "plotters"] }

[[bench]]
name = "symbol_list"
harness = false

[dependencies]
shader-sense-core.workspace = true
shader-sense-symbols.workspace = true
shader-sense-validator.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
