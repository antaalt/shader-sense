[package]
name = "shader-renderer"
description = "Native renderer that render images remotely."
repository = "https://github.com/antaalt/shader-sense"
categories = ["development-tools", "graphics"]
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
shader-sense = { version = "1.4.3", path = "../shader-sense" }
# Only use this for the RPC part.
lsp-server= "=0.7.8"
serde = { version = "1.0.34", features = ["derive"] }
serde_json = "1.0.50"
log = "0.4.34"
wgpu = { version="30.0.1", features = ["spirv"] }
pollster = "1.0.1"
base64-bytes = "0.1.0"
env_logger = "0.11.11"
image = "0.25.10"
